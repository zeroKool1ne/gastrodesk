services:
  n8n:
    image: n8nio/n8n:latest
    container_name: gastrodesk-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Zeitzone: n8n braucht sie fuer Cron-Trigger und Datumsrechnung
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      # Keine Telemetrie an n8n senden
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      # Workflows duerfen den Host erreichen (unser Service auf dem Mac)
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      # Benanntes Volume: Workflows und Zugangsdaten ueberleben ein Neustart
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
